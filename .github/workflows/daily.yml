name: Daily rebuild

on:
  schedule:
    - cron: "15 6 * * *"      # 06:15 UTC every day (after Bitstamp's daily candle closes at 00:00 UTC)
  workflow_dispatch:
    inputs:
      post:
        description: "Also send today's social posts (scheduled runs always post)"
        type: boolean
        default: false
      test_alert:
        description: "Email a sample milestone alert (checks the Gmail setup)"
        type: boolean
        default: false
      test_x:
        description: "Post today's update to X only (checks the X keys; refuses unless they belong to @halvingclock)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save yesterday's state (for milestone detection and the once-a-day guard)
        run: curl -fsS https://halvingclock.com/state.json -o prev_state.json || echo '{}' > prev_state.json
      - name: Build (fetch mempool.space + Bitstamp, regenerate site/)
        run: python build.py
      - name: Social posts (Bluesky, Nostr, X; each skipped until its secrets exist). Runs before deploy so the posted marker ships with the site
        id: social
        if: github.event_name == 'schedule' || inputs.post
        continue-on-error: true         # a platform outage must not stop the site update
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}           # milestone drafts are emailed, not posted
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
        run: python social.py --prev prev_state.json
      - name: Test X post
        if: inputs.test_x
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python social.py --prev prev_state.json --only x --force
      - name: Test milestone email
        if: inputs.test_alert
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
        run: python social.py --test-alert
      - name: Deploy to Cloudflare (Worker serving ./site)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"   # the action's default is older and can't deploy an assets-only Worker
          command: deploy
      - name: Report social-post failure (after the site is deployed)
        if: steps.social.outcome == 'failure'
        run: echo "::error::One or more social posts failed; see the Social posts step log." && exit 1
