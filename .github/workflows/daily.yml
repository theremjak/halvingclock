name: Daily rebuild

on:
  schedule:
    - cron: "15 6 * * *"      # 06:15 UTC: overnight rebuild with the closed daily candle (no posting)
    - cron: "30 12 * * *"     # 12:30 UTC = 8:30am US Eastern (7:30 after Nov DST): rebuild + social posts
    - cron: "45 15 * * *"     # backstops: GitHub delays scheduled runs by hours and sometimes drops them outright
    - cron: "45 19 * * *"     #   (2026-10-02: the 06:15 run started 12:26, the 12:30 run never came). posted_for makes repeats no-ops
  workflow_dispatch:
    inputs:
      post:
        description: "Also send today's social posts (scheduled runs always post)"
        type: boolean
        default: false
      test_alert:
        description: "Email a sample milestone alert (checks the Gmail setup)"
        type: boolean
        default: false
      bluesky_profile:
        description: "Set the Bluesky bio from social.py (cross-links X and Nostr)"
        type: boolean
        default: false
      test_x:
        description: "Post today's update to X only (checks the X keys; refuses unless they belong to @halvingclock)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # keep-alive: re-enable this workflow so GitHub's 60-day inactivity pause never triggers

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save yesterday's state (for milestone detection and the once-a-day guard)
        run: curl -fsS "https://halvingclock.com/state.json?v=$GITHUB_RUN_ID" -o prev_state.json || echo '{}' > prev_state.json   # cache-buster: edge may serve the pre-deploy copy
      - name: Build (fetch mempool.space + Bitstamp, regenerate site/)
        run: python build.py
      - name: Posting window? (any scheduled run that actually starts at/after 12:00 UTC; a late 06:15 run counts)
        id: when
        if: github.event_name == 'schedule'
        run: echo "post=$([ "$(date -u +%-H)" -ge 12 ] && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
      - name: Social posts (Bluesky, Nostr, X; each skipped until its secrets exist). Runs before deploy so the posted marker ships with the site
        id: social
        if: steps.when.outputs.post == 'true' || inputs.post
        continue-on-error: true         # a platform outage must not stop the site update
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}                  # OAuth 2.0 (pay-per-use apps)
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN_INIT: ${{ secrets.X_REFRESH_TOKEN_INIT }}
          X_INIT_ID: ${{ secrets.X_INIT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # rotating X refresh token lives in Workers KV
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}           # milestone drafts are emailed, not posted
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
        run: python social.py --prev prev_state.json
      - name: Test X post
        if: inputs.test_x
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}                  # OAuth 2.0 (pay-per-use apps)
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN_INIT: ${{ secrets.X_REFRESH_TOKEN_INIT }}
          X_INIT_ID: ${{ secrets.X_INIT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # rotating X refresh token lives in Workers KV
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python social.py --x-diagnose && python social.py --prev prev_state.json --only x --force
      - name: Set Bluesky bio
        if: inputs.bluesky_profile
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python social.py --bluesky-profile
      - name: Test milestone email
        if: inputs.test_alert
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
        run: python social.py --test-alert
      - name: Deploy to Cloudflare (Worker serving ./site)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"   # the action's default is older and can't deploy an assets-only Worker
          command: deploy
      - name: Report social-post failure (after the site is deployed)
        if: steps.social.outcome == 'failure'
        run: echo "::error::One or more social posts failed; see the Social posts step log." && exit 1
      - name: Keep-alive (reset GitHub's 60-day inactivity timer for scheduled workflows; no commits needed)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" && echo "workflow re-enabled; inactivity timer reset"
