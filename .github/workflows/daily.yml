name: Daily rebuild

on:
  schedule:
    - cron: "15 6 * * *"      # 06:15 UTC every day (after Bitstamp's daily candle closes at 00:00 UTC)
  workflow_dispatch: {}        # "Run workflow" button for manual rebuilds

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build (fetch mempool.space + Bitstamp, regenerate site/)
        run: python build.py
      - name: Deploy to Cloudflare (Worker serving ./site)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"   # the action's default is older and can't deploy an assets-only Worker
          command: deploy
